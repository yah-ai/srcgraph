[workspace]
members = [
    "crates/srcgraph-core",
    "crates/srcgraph-metrics",
]
resolver = "2"

[workspace.package]
version = "0.8.21"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/srcgraph"

[workspace.dependencies]
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
quick-xml = { version = "0.36", features = ["serialize"] }
srcgraph-core = { path = "crates/srcgraph-core", version = "0.8.21" }
srcgraph-metrics = { path = "crates/srcgraph-metrics", version = "0.8.21" }
